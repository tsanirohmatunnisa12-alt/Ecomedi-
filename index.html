<h3>Apa yang ingin Anda lakukan?</h3><div class=tiles>${tile('fc','Prediksi kebutuhan obat','pill')}${tile('cl','Klasifikasi limbah','bag')}${tile('qr','Pindai QR','qr')}${tile('tr','Pelacakan limbah','truck')}${tile('rp','Laporan','chart')}</div>
<div class=g4>${k('Total limbah tercatat',t.toFixed(1)+' kg')}${k('Wadah belum selesai diolah',C.filter(c=>c.st<3).length)}${S.role=='dinas'?'':k('Obat perlu perhatian',M.filter(m=>calc(m).c!='ok').length)}${k('Sudah diolah',Math.round(dn/t*100)+'%')}</div>
<div class=card><h3>Siklus ekonomi sirkular Ecomedi</h3><div class=cyc><div class=cs><span class="im sm">${I('pill')}</span><b>Cegah</b><small>${M.filter(m=>calc(m).risk>0).length} obat berisiko dipantau</small></div><div class=cs><span class="im sm">${I('qr')}</span><b>Lacak</b><small>${C.length} wadah ber-QR</small></div><div class=cs><span class="im sm">${I('truck')}</span><b>Olah</b><small>${Math.round(dn/t*100)}% sudah diolah</small></div><div class=cs><span class="im sm">${I('loop')}</span><b>Pulihkan</b><small>Sesuai izin pengelola</small></div></div></div>
<div class=g2><div class=card><h3>Limbah per kategori (kg)</h3>${bars()}</div><div class=card><h3>Peringatan</h3>${al.length?al.map(a=>`<div class="al ${a[0]}">${a[1]}</div>`).join(''):'<div class="al ok">Tidak ada peringatan.</div>'}</div></div>
<div class=card><h3>Panduan singkat</h3><div class=cyc><div class=cs><b>1</b><small>Cek prediksi obat dan atur pengadaan</small></div><div class=cs><b>2</b><small>Klasifikasikan limbah, buat QR wadah</small></div><div class=cs><b>3</b><small>Pindai QR, perbarui status sampai diolah</small></div></div></div>`},
fc(){return`<div class=card><h3>Cara kerja prediksi</h3><p style="margin:0">Ecomedi menghitung rata-rata pemakaian 6 bulan terakhir (bulan terbaru berbobot lebih besar), mengalikannya dengan faktor musim, lalu menambah cadangan 20%. Hasilnya dibandingkan dengan stok dan tanggal kedaluwarsa.</p><label>Faktor musim bulan depan: <b>${S.season.toFixed(2)}×</b></label><input type=range min=.8 max=1.5 step=.05 value=${S.season} oninput="S.season=+this.value;R()" style="width:min(380px,100%);padding:0"><div class=note>Simulasi metode sederhana. Model asli perlu diuji dengan data historis fasilitas sebelum dipakai mengambil keputusan.</div></div><input class=in placeholder="Cari nama obat" oninput="flt(this.value)" style="margin-bottom:12px"><div class="card tw"><table><tr><th>Obat<th>Stok<th>Prediksi<th>Kedaluwarsa<th>Saran pengadaan<th>Status</tr>${M.map(m=>{const r=calc(m);return`<tr data-s="${m.n.toLowerCase()}"><td>${m.n}<td>${m.stock} ${m.u}<div class=mb><i style="width:${Math.min(100,m.stock/(r.f*3)*100)}%"></i></div><td>${r.f}<td>${m.exp} hari<td>${r.need?'+'+r.need:'Tidak perlu'}<td><span class="bd ${r.c}">${r.st}</span>${r.risk?`<div class=note>±${r.risk} ${m.u} berisiko terbuang. Prioritaskan pemakaian atau alihkan sesuai aturan.</div>`:''}`}).join('')}</table><div class=note>Saran pengadaan perlu divalidasi tenaga farmasi.</div></div><div class=card><h3>Perbarui stok</h3><select id=ms>${M.map((m,i)=>`<option value=${i}>${m.n}</option>`).join('')}</select> <input id=mv type=number min=0 placeholder="Stok baru"> <button class=btn onclick="if($('#mv').value!==''&&+$('#mv').value>=0){M[+$('#ms').value].stock=+$('#mv').value;save();toast('Stok disimpan');R()}">Simpan stok</button></div>`},
cl(){return`<div class=g2><div class=card><h3>Data limbah</h3><label>Unit sumber limbah</label><select id=src><option>IGD<option>Poli Umum<option>Rawat Inap<option>Farmasi<option>Laboratorium<option>Poli Gigi</select><label>Berat perkiraan (kg)</label><input id=kg type=number min=0 step=.1><label>Ketuk karakteristik yang sesuai</label><div class=tiles style="margin:6px 0 14px">${[['tajam','Benda tajam'],['inf','Terkena darah atau cairan tubuh'],['far','Obat atau vaksin kedaluwarsa'],['sito','Sisa obat sitotoksik'],['kim','Bahan kimia atau reagen']].map(f=>`<label class=tile style="margin:0;color:var(--tx);font-size:13px"><input type=checkbox name=fl value=${f[0]}><span class="im sm">${I(IC[f[0]])}</span>${f[1]}</label>`).join('')}</div><button class=btn onclick="ana()">Analisis dengan Ecomedi</button></div><div class=card id=res><h3>Rekomendasi</h3><span class=note>Isi data di sebelah kiri, lalu pilih Analisis.</span></div></div>`},
qr(){const c=C.find(x=>x.id==S.scan);return`<div class=card style="text-align:center"><h3>Pindai QR wadah</h3><div class=vf>${I('qr')}${S.scanning?'<i></i>':''}</div><select id=sc>${C.map(x=>`<option ${x.id==S.pick?'selected':''}>${x.id}</option>`).join('')}</select> <button class=btn onclick="scan()">Pindai (simulasi)</button><div class=note>Pemindaian kamera sungguhan masuk tahap pengembangan berikutnya.</div></div>${c&&!S.scanning?det(c):''}`},
tr(){if(S.role=='dinas')return`<div class=card><h3>Ringkasan agregat fasilitas</h3>${ST.map((s,i)=>`<div class=row><span>${s}</span><b>${C.filter(c=>c.st==i).length} wadah · ${C.filter(c=>c.st==i).reduce((a,c)=>a+c.kg,0).toFixed(1)} kg</b></div>`).join('')}<div class=note>Dinas hanya melihat data agregat, bukan rincian internal fasilitas.</div></div>`;const c=C.find(x=>x.id==S.sel);return`${c?det(c):''}<div class=bar><input class=in placeholder="Cari kode, kategori, sumber" oninput="flt(this.value)">${ROLES[S.role].includes('cl')?'<button class=btn onclick="go(\'cl\')">+ Baru</button>':''}</div>${C.map(x=>`<div class="card r2" tabindex=0 data-s="${(x.id+CAT[x.cat][0]+x.src).toLowerCase()}" onclick="S.sel='${x.id}';scrollTo(0,0);R()"><span class="im sm">${I(IC[x.cat])}</span><div style="flex:1"><b>${x.id}</b> · ${CAT[x.cat][0]}<div class=note style="margin:0">${x.src} · ${x.kg} kg</div></div><span class="bd ${x.st==0?'wa':'ok'}">${ST[x.st]}</span></div>`).join('')}${c?'':'<div class=note>Pilih satu wadah untuk melihat QR dan jejak audit.</div>'}`},
rp(){const t={};C.forEach(c=>{t[c.cat]=t[c.cat]||[0,0];t[c.cat][0]+=c.kg;t[c.cat][1]++});return`<div class=g4>${k('Total limbah',T().toFixed(1)+' kg')}${k('Jumlah wadah',C.length)}${k('Sudah diolah',C.filter(c=>c.st==3).length+' wadah')}${k('Kepatuhan batas simpan',comp()+'%')}</div><div class=card><h3>Rekap per kategori</h3><div class=tw><table><tr><th>Kategori<th>Wadah<th>Berat (kg)</tr>${Object.keys(t).map(c=>`<tr><td>${CAT[c][0]}<td>${t[c][1]}<td>${t[c][0].toFixed(1)}`).join('')}</table></div><div class=noprint style="margin-top:12px"><button class=btn onclick="csv()">Unduh Excel (CSV)</button> <button class="btn s" onclick="print()">Cetak / simpan PDF</button></div><div class=note>Data ini membantu menyiapkan pelaporan ke SPEED. Ecomedi belum terhubung langsung ke SPEED.</div></div><div class=card><h3>Limbah per kategori (kg)</h3>${bars()}</div>`},
us(){const nm=(U.find(u=>u.r==S.role)||{n:'Pengguna'}).n;return`<div class=hc><span class=im>${I('user')}</span><div><h2>${nm}</h2><div>${RL[S.role]} · Puskesmas Contoh</div></div></div><div class=g4>${k('Kepatuhan batas simpan',comp()+'%')}${k('Obat perlu perhatian',M.filter(m=>calc(m).c!='ok').length)}${k('Wadah aktif',C.filter(c=>c.st<3).length)}</div><div class="card list">${[['rp','file','Laporan dan analitik'],['cl','bag','Klasifikasi limbah'],['tr','truck','Pelacakan limbah']].filter(x=>ROLES[S.role].includes(x[0])).map(x=>`<a tabindex=0 onclick="go('${x[0]}')">${I(x[1])}<span>${x[2]}</span>›</a>`).join('')}<a tabindex=0 onclick="out()">${I('out')}<span>Keluar</span></a></div>
${S.role=='admin'?`<div class="card tw"><h3>Kelola akun</h3><table><tr><th>Nama<th>Peran</tr>${U.map(u=>`<tr><td>${u.n}<td>${RL[u.r]}`).join('')}</table><label>Tambah akun</label><input id=un placeholder="Nama"> <select id=ur>${Object.keys(RL).map(r=>`<option value=${r}>${RL[r]}</option>`).join('')}</select> <button class=btn onclick="if($('#un').value.trim()){U.push({n:$('#un').value.trim(),r:$('#ur').value});save();toast('Akun ditambahkan');R()}">Tambah</button></div>`:''}
<div class=card><h3>Pengaturan</h3><label>Batas simpan limbah (hari), isi sesuai izin dan ketentuan fasilitas</label><input type=number min=1 value=${LIM} onchange="LIM=Math.max(1,+this.value||7);save();R()"><label>Bahasa tampilan</label><select><option>Bahasa Indonesia<option disabled>English (segera)</select><div style="margin-top:14px"><button class="btn s" onclick="const d=document.documentElement;d.dataset.t=d.dataset.t=='dark'?'light':'dark'">Ganti tema terang/gelap</button> <button class="btn s" onclick="if(confirm('Kembalikan data contoh?')){localStorage.removeItem('ecomedi_v2');location.reload()}">Reset data contoh</button></div></div>`}};
function scan(){S.pick=$('#sc').value;S.scanning=1;S.scan=null;R();setTimeout(()=>{S.scanning=0;S.scan=S.pick;toast('Wadah '+S.pick+' ditemukan');R()},900)}
function ana(){const f=[...document.querySelectorAll('[name=fl]:checked')].map(x=>x.value),kg=+$('#kg').value,cat=['sito','tajam','inf','far','kim'].find(p=>f.includes(p)),w=[];if(!f.length)w.push('Pilih minimal satu karakteristik limbah.');if(!(kg>0))w.push('Isi berat perkiraan limbah.');if(f.length>1)w.push('Limbah campuran terdeteksi. Pisahkan per kategori agar penanganannya tepat.');S.draft=cat&&kg>0?{cat,kg,src:$('#src').value}:null;$('#res').innerHTML=`<h3>Rekomendasi</h3>${cat?`<div class=r2><span class=im>${I(IC[cat])}</span><b>${CAT[cat][0]}</b></div><p>${CAT[cat][1]}</p><div class=cyc>${[['bag','Pilah'],['shield','Simpan'],['truck','Angkut'],['loop','Olah']].map(x=>`<div class=cs><span class="im sm">${I(x[0])}</span><small>${x[1]}</small></div>`).join('')}</div>`:''}${w.map(x=>`<div class="al wa" style="margin-top:8px">${x}</div>`).join('')}${S.draft?'<p><button class=btn onclick="val()">Validasi dan buat QR</button></p><div class=note>Klasifikasi akhir ditetapkan petugas berwenang. Rekomendasi ini hanya membantu.</div>':''}`}
function val(){const d=S.draft;if(!d)return;const id='EM-'+String(C.length+1).padStart(4,'0'),c={id,cat:d.cat,src:d.src,kg:d.kg,st:0,d:0,lg:[]};C.push(c);log(c,'Dibuat dan disimpan (klasifikasi divalidasi)');S.sel=id;S.v='tr';toast('QR wadah '+id+' dibuat');scrollTo(0,0);R()}
function csv(){const r=[['Kode','Kategori','Sumber','Berat (kg)','Status']].concat(C.map(c=>[c.id,CAT[c.cat][0],c.src,c.kg,ST[c.st]])),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='laporan-ecomedi.csv';a.click()}
function R(){const A=$('#app');if(!S.role){A.innerHTML=`<div class=lgn><svg class=hero><use href="#hero"/></svg><h2>ECOMEDI</h2><p style="margin:2px 0 14px">Healthcare Waste Management &amp; Smart Inventory System</p><form onsubmit="event.preventDefault();login()"><label>Masuk sebagai</label><div class=chips>${Object.keys(RL).map(r=>`<button type=button class="${S.lr==r?'on':''}" onclick="S.lr='${r}';R()">${RL[r]}</button>`).join('')}</div><div class=note style="margin:0 0 8px">${RD[S.lr]}</div><label>Email</label><input class=in type=email value="${S.lr}@puskesmas-contoh.id"><label>Kata sandi</label><input class=in type=password value="demo1234"><p><button class=btn style="width:100%">Masuk</button></p></form><div class=chips style="justify-content:center"><span class="bd ok">Preventive</span><span class="bd ok">Traceable</span><span class="bd ok">Accountable</span></div><div class=note>Prototipe demo di Puskesmas Contoh. Tidak ada autentikasi sungguhan, data adalah contoh, AI berupa simulasi, dan belum terhubung ke SPEED.</div></div>`;return}
const al=AL(),nav=NAV.filter(n=>ROLES[S.role].includes(n[0]));A.innerHTML=`<div class=wrap><div class=bar><div class=brand>${I('leaf')}ECOMEDI</div><div style="position:relative"><button class=rb onclick="S.bell=!S.bell;R()" aria-label="Notifikasi">${I('bell')}${al.length?`<span class=dot>${al.length}</span>`:''}</button>${S.bell?`<div class=pn>${al.length?al.map(a=>`<div class="al ${a[0]}">${a[1]}</div>`).join(''):'Tidak ada notifikasi.'}</div>`:''}</div></div>${S.v=='dash'?'':`<h1>${TT[S.v]}</h1>`}${V[S.v]()}</div><nav class=nav>${nav.map(n=>`<a tabindex=0 class="${S.v==n[0]?'on':''}" onclick="go('${n[0]}')">${I(n[2])}${n[1]}</a>`).join('')}</nav>`;document.querySelectorAll('[data-qr]').forEach(e=>{try{new QRCode(e,{text:e.dataset.qr,width:116,height:116})}catch(x){e.textContent=e.dataset.qr}})}
R();
